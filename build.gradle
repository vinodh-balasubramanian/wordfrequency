plugins {
  id 'java'
  id 'org.springframework.boot' version '3.4.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.sonarqube' version '6.0.1.5171'
  id 'jacoco'
}

group = 'com.labforward'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.apache.commons:commons-text:1.10.0'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'
  implementation 'org.slf4j:slf4j-api:2.0.9'
  implementation 'ch.qos.logback:logback-classic:1.4.11'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
  finalizedBy(tasks.jacocoTestReport)
}
tasks.jacocoTestReport {
  dependsOn(tasks.test) // Tests must run before generating the report
  reports {
    xml.required.set(true) // Required for SonarQube
    html.required.set(true)
  }
}
tasks.jacocoTestCoverageVerification {
  dependsOn(tasks.jacocoTestReport)
}

sonar {
  properties {
    property 'sonar.projectKey', 'wordfrequency'
    property 'sonar.projectName', 'wordfrequency'
    property 'sonar.host.url', 'http://localhost:9000'
    property 'sonar.token', 'sqp_6a096f50ad8f1070688a4fb657c435d397a04b8b'
    property 'sonar.sources', 'src/main/java'
    property 'sonar.tests', 'src/test/java'
    property 'sonar.java.binaries', 'build/classes/java/main'
    property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
  }
}
